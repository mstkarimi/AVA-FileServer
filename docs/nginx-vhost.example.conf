# ---------------------------------------------------------------------------
# Example host-level nginx vhost for fronting the file server container.
#
# Use this when the container is bound to 127.0.0.1 (set BIND_ADDR=127.0.0.1
# in .env) and you want a real domain + a single 443 endpoint.
#
# Replace `files.example.com` and the certificate paths.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name files.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name files.example.com;

    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    client_max_body_size 110M;

    location / {
        # CORS for embedding (audio/video tags from any origin)
        add_header 'Access-Control-Allow-Origin'   '*' always;
        add_header 'Access-Control-Allow-Methods'  'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'  'Range, Content-Type' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Range, Content-Type';
            add_header 'Content-Length' 0;
            add_header 'Content-Type'   'text/plain';
            return 204;
        }

        # Container does its own TLS — accept its self-signed cert when proxying
        proxy_pass https://127.0.0.1:8082;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        # Streaming-friendly
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
