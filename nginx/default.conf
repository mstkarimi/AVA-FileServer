server {
    listen 8082 ssl http2;
    server_tokens off;

    ssl_certificate     /data/certs/fullchain.pem;
    ssl_certificate_key /data/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 110M;

    # CORS for embedding share links (audio/video tags from any origin)
    set $cors_origin '*';

    # Root-level share URL:
    #   /<hash>.<ext>   — file share
    #   /<hash>         — folder share root (redirects to /<hash>/)
    #   /<hash>/        — folder share index (HTML)
    #   /<hash>/path/x  — file or sub-folder inside a folder share
    location ~ "^/[A-Za-z0-9_-]{22}(\.[A-Za-z0-9]+|/.*)?$" {
        rewrite ^/(.*)$ /s/$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        add_header X-Content-Type-Options  "nosniff" always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header Access-Control-Allow-Origin   $cors_origin always;
        add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    }

    # Legacy /s/ prefix — keep working
    location /s/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header Access-Control-Allow-Origin   $cors_origin always;
        add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    }

    # Admin API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        add_header X-Frame-Options         "DENY" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Referrer-Policy         "no-referrer" always;
    }

    # Admin SPA
    location / {
        root /app/frontend/dist;
        try_files $uri /index.html;
        add_header X-Frame-Options         "DENY" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Referrer-Policy         "no-referrer" always;
    }
}
